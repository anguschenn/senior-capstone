name: Lint & Analyze

on:
  push:
    branches: [main, demo_1]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssdemo_1
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # pubspec.yaml declares .env as an asset, but .env is gitignored because it
      # holds secrets. Without a placeholder, `flutter analyze` reports
      # asset_does_not_exist as a warning and fails the job on every commit.
      - run: touch .env
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/
      - run: flutter analyze --no-fatal-infos
